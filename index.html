<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automated Rostering Portal</title>
  <!-- Bootstrap 5 CDN for clean, responsive UI -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card-custom { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .badge-status { font-size: 0.85rem; padding: 0.4em 0.8em; }
  </style>
</head>
<body class="p-3 p-md-4">

  <div class="container max-width-lg" id="app">
    <!-- Loader -->
    <div class="text-center py-5" id="loading">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Loading Rostering Portal...</p>
    </div>

    <!-- Main Content Container -->
    <div id="content" style="display: none;"></div>
  </div>

  <script>
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const view = urlParams.get('page') || 'volunteer';
      
      if (view === 'admin') {
        renderAdminDashboard();
      } else {
        renderVolunteerPortal();
      }
    };

    // --- ADMIN DASHBOARD VIEW ---
    function renderAdminDashboard() {
      google.script.run.withSuccessHandler(data => {
        document.getElementById('loading').style.display = 'none';
        const contentDiv = document.getElementById('content');
        contentDiv.style.display = 'block';

        let rowsHtml = '';
        data.forEach(entry => {
          const badgeClass = entry.status === 'ASSIGNED' ? 'bg-success' : 'bg-danger';
          rowsHtml += `
            <tr>
              <td>${entry.slotId || '-'}</td>
              <td>${entry.volunteerId || '<strong class="text-danger">UNASSIGNED</strong>'}</td>
              <td><span class="badge ${badgeClass} badge-status">${entry.status}</span></td>
              <td>
                <button class="btn btn-sm btn-outline-secondary" onclick="manualOverride('${entry.slotId}')">Edit</button>
              </td>
            </tr>
          `;
        });

        contentDiv.innerHTML = `
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Secretariat Control Panel</h2>
            <button class="btn btn-primary" onclick="triggerEngine()">🚀 Run Auto-Roster Engine</button>
          </div>
          
          <div class="card card-custom p-3 mb-4">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr>
                    <th>Slot ID</th>
                    <th>Assigned Volunteer</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml || '<tr><td colspan="4" class="text-center text-muted">No roster entries generated yet.</td></tr>'}</tbody>
              </table>
            </div>
          </div>
        `;
      }).getAdminDashboardData();
    }

    function triggerEngine() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('content').style.display = 'none';
      google.script.run.withSuccessHandler(res => {
        renderAdminDashboard();
      }).generateMonthlyRoster();
    }

    // --- VOLUNTEER PORTAL VIEW ---
    function renderVolunteerPortal() {
      document.getElementById('loading').style.display = 'none';
      const contentDiv = document.getElementById('content');
      contentDiv.style.display = 'block';

      contentDiv.innerHTML = `
        <div class="card card-custom p-4 max-width-md mx-auto">
          <h3 class="mb-3">Volunteer Shift Availability</h3>
          <p class="text-muted small">Select your availability for upcoming shift schedules.</p>
          
          <form id="availForm">
            <div class="mb-3">
              <label class="form-label font-weight-bold">Weekend Slot 1 (Sat 5:30 PM)</label>
              <select class="form-select" name="slot1">
                <option value="PREFERRED">🟢 Preferred</option>
                <option value="AVAILABLE" selected>🟡 Available</option>
                <option value="UNAVAILABLE">⚪ Unavailable</option>
              </select>
            </div>
            
            <div class="mb-3">
              <label class="form-label font-weight-bold">Weekend Slot 2 (Sun 9:00 AM)</label>
              <select class="form-select" name="slot2">
                <option value="PREFERRED">🟢 Preferred</option>
                <option value="AVAILABLE">🟡 Available</option>
                <option value="UNAVAILABLE" selected>⚪ Unavailable</option>
              </select>
            </div>

            <button type="button" class="btn btn-success w-100 mt-2" onclick="alert('Availability saved!')">Submit Preferences</button>
          </form>
        </div>
      `;
    }

    function manualOverride(slotId) {
      alert('Manual override triggered for slot: ' + slotId);
    }
  </script>
</body>
</html>
